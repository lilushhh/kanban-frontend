<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <h1>Projects</h1>
        <div class="input-container">
            <input type="text" id="projectNameInput" placeholder="Enter project name">
            <button onclick="addProject()">Add Project</button>
        </div>
        <div id="participantsSection">
            <label for="participantsInput">Add Participants: </label>
            <input type="text" id="participantsInput" placeholder="Enter names">
        </div>
        <div class="projects-wrapper">
            <div id="projectsList" class="projects-list">

            </div>
        </div>
    </div>

    <div id="modalOverlay" style="display: none;" class="modal-overlay">
        <div class="modal-content">
            <h3>Update Project</h3>
            <label for="newProjectName">New Project Name: </label>
            <input type="text" id="newProjectNameInput" placeholder="if u don't want to change the name - leave it empty">

            <label for="newParticipantsList">New Participants List: </label>
            <input type="text" id="newParticipantsListInput" placeholder="if u don't want to change the participant list - write the original list">

            <div class="modal-buttons">
                <button id="saveProjectBtn" onclick="submitUpdate()">Save</button>
                <button id="cancelProjectBtn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>
    <script type="module" src="./dist/script.js"></script>
</body>

</html>
